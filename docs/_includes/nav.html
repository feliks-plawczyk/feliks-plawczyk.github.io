<nav class="site-nav" aria-label="Navigation principale">
  <ul>
    {% for item in site.data.navigation %}
      {% assign prefix = page.url | slice: 0, item.url.size %}
      <li>
        <a href="{{ item.url | relative_url }}"{% if prefix == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      </li>
    {% endfor %}
  </ul>
</nav>
